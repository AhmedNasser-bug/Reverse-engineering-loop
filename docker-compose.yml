version: '3.8'

services:
  harness:
    build: .
    ports:
      - "8080:8080"
    environment:
      - HONCHO_API_KEY=${HONCHO_API_KEY}
      - HONCHO_API_URL=${HONCHO_API_URL:-https://api.honcho.dev/v1}
      - DASHBOARD_PORT=8080
    volumes:
      - .:/app
    command: python harness.py serve --port 8080
